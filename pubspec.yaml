name: pulse_audio_player
description: Minimal modern Android music player.
publish_to: 'none'
version: 1.1.3+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  just_audio: ^0.9.46
  audio_service: ^0.18.16
  audio_session: ^0.1.25
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.1
  audiotags: ^1.4.5
  file_picker: ^8.3.7
  permission_handler: ^11.4.0
  palette_generator: ^0.3.3+7
  google_fonts: ^6.2.1
  crypto: ^3.0.6
  collection: ^1.19.1
  rxdart: ^0.28.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
